<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolVote • Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><style>
:root{--p:rgba(18,25,55,.84);--l:#ffffff1a;--t:#f7f8ff;--m:#aab4d8;--a:#7c5cff;--b:#20d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--t);font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 8% 0,#342476,transparent 30%),radial-gradient(circle at 95% 20%,#075d73,transparent 27%),#060817}.wrap{width:min(1200px,94%);margin:auto;padding:22px 0 60px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:25px;font-weight:900}.brand span{color:var(--b)}.panel{background:var(--p);border:1px solid var(--l);border-radius:22px;padding:22px;backdrop-filter:blur(14px);box-shadow:0 20px 55px #0005}.hero{text-align:center;margin:18px 0;padding:30px}.hero h1{font-size:clamp(31px,5vw,54px);margin:4px;background:linear-gradient(90deg,#fff,#9ceeff,#b9a8ff);-webkit-background-clip:text;color:transparent}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px}.field{margin:9px 0}.field label{display:block;color:var(--m);font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:11px;border:1px solid var(--l);background:#060a1d;color:#fff;font-size:15px}.field textarea{min-height:80px}.btn{padding:11px 14px;border-radius:11px;border:1px solid var(--l);background:#ffffff0b;color:#fff;font-weight:800;cursor:pointer}.primary{background:linear-gradient(90deg,var(--a),var(--b));border:0}.danger{background:#ff484818}.full{width:100%}.muted{color:var(--m);font-size:13px}.notice{padding:12px;border-radius:12px;background:#ffffff08;color:var(--m);margin:10px 0}.error{background:#ff3d3d18;color:#ffb2b2}.success{background:#20d99218;color:#9ef4ce}.hidden{display:none!important}.election{padding:14px;border:1px solid var(--l);border-radius:15px;margin:10px 0;background:#080c20}.election.active{border-color:#43e6a088}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:#ffffff12}.candidate{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--l)}.photo{width:60px;height:60px;object-fit:cover;border-radius:12px;background:#171d3d}.symbol{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{padding:14px;border:1px solid var(--l);border-radius:13px;background:#ffffff07}.stat b{display:block;font-size:25px}.bar{height:10px;border-radius:10px;background:#ffffff10;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--a),var(--b))}@media(max-width:820px){.layout{grid-template-columns:1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.candidate{grid-template-columns:54px 1fr}.candidate>div:last-child{grid-column:1/-1}.panel{padding:17px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">🏫 School<span>Vote</span> Admin</div><button id="logout" class="btn hidden">Logout</button></header><section id="login" class="panel hero"><div style="font-size:44px">🔐</div><h1>Admin Dashboard</h1><p class="muted">Manage elections, candidates and results.</p><form id="loginForm"><div class="field"><label>Admin email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary full">Admin Login</button></form><div id="loginMsg"></div></section><section id="dashboard" class="hidden"><section class="panel hero"><h1>Election Control Center</h1><p class="muted">House Captain • Head Boy / Head Girl</p></section><div id="msg"></div><div class="layout"><aside><div class="panel"><h2>Create Election</h2><form id="electionForm"><div class="field"><label>Election title</label><input id="etitle" required placeholder="House Captain Boys"></div><div class="field"><label>Category</label><select id="ecategory"><option value="house_captain">House Captain</option><option value="head_boy_girl">Head Boy / Head Girl</option></select></div><div class="field"><label>Gender</label><select id="egender"><option value="boys">Boys</option><option value="girls">Girls</option><option value="all">All</option></select></div><div class="field"><label>Description</label><textarea id="edesc" placeholder="Select one candidate."></textarea></div><div class="field"><label>Start time</label><input id="estart" type="datetime-local"></div><div class="field"><label>End time</label><input id="eend" type="datetime-local"></div><button class="btn primary full">Create Election</button></form></div><div class="panel" style="margin-top:18px"><h2>Elections</h2><div id="elections"></div></div></aside><main><div class="panel"><div class="row"><div><h2 id="selectedTitle">Select an election</h2><div id="selectedMeta" class="muted"></div></div><button id="refresh" class="btn">Refresh</button></div><div id="candidateFormBox" class="hidden"><hr style="border-color:var(--l);margin:20px 0"><h3>Add Candidate</h3><form id="candidateForm"><div class="field"><label>Name</label><input id="cname" required></div><div class="field"><label>Class</label><input id="cclass" placeholder="Class 9"></div><div class="field"><label>House</label><input id="chouse" placeholder="Red House"></div><div class="field"><label>Election sign/name</label><input id="csymbol" placeholder="Star"></div><div class="field"><label>Candidate photo URL</label><input id="cphoto" type="url" placeholder="https://..."></div><div class="field"><label>Election sign image URL</label><input id="csymbolurl" type="url" placeholder="https://..."></div><button class="btn primary">Add Candidate</button></form></div><div id="candidates" style="margin-top:18px"></div></div><div id="results" class="panel hidden" style="margin-top:18px"></div></main></div></section></div>
<script>const $=id=>document.getElementById(id);let selected=null;function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function ph(t){return'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="#171d3d"/><text x="50%" y="50%" fill="#a5afd0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="12">${t}</text></svg>`)}function msg(t,type=''){$('msg').innerHTML=`<div class="notice ${type}">${esc(t)}</div>`}async function admin(){const s=await schoolVote.session();if(!s)throw Error('Please log in.');const{data,error}=await db.from('profiles').select('role').eq('id',s.user.id).single();if(error)throw error;if(data.role!=='admin')throw Error('This account is not an admin.')}async function loadElections(){const{data,error}=await db.from('elections').select('*').order('created_at',{ascending:false});if(error)throw error;$('elections').innerHTML=data?.length?data.map(e=>`<div class="election ${e.is_active?'active':''}"><div class="row"><strong>${esc(e.title)}</strong><span class="pill">${e.is_active?'OPEN':'CLOSED'}</span></div><div class="muted">${esc(e.category)} • ${esc(e.gender)}</div><div class="actions"><button class="btn" data-select="${e.id}">Manage</button><button class="btn ${e.is_active?'danger':'primary'}" data-toggle="${e.id}" data-open="${!e.is_active}">${e.is_active?'Close':'Open'}</button></div></div>`).join(''):'<div class="muted">No elections.</div>';document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>selectElection(b.dataset.select));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggleElection(b.dataset.toggle,b.dataset.open==='true'))}async function toggleElection(id,open){try{if(open){let{error:e1}=await db.from('elections').update({is_active:false}).eq('is_active',true);if(e1)throw e1}let{error}=await db.from('elections').update({is_active:open}).eq('id',id);if(error)throw error;msg(open?'Election opened.':'Election closed.','success');await loadElections();if(selected===id)await selectElection(id)}catch(e){msg(e.message,'error')}}async function selectElection(id){selected=id;const{data:e,error}=await db.from('elections').select('*').eq('id',id).single();if(error)throw error;$('selectedTitle').textContent=e.title;$('selectedMeta').textContent=`${e.category} • ${e.gender} • ${e.is_active?'OPEN':'CLOSED'}`;$('candidateFormBox').classList.remove('hidden');await loadCandidates();await loadResults()}async function loadCandidates(){const{data,error}=await db.from('candidates').select('*').eq('election_id',selected).order('display_order').order('name');if(error)throw error;$('candidates').innerHTML=`<h3>Candidates (${data?.length||0})</h3>`+(data?.length?data.map(c=>`<div class="candidate"><img class="photo" src="${esc(c.photo_url||ph('PHOTO'))}"><div><strong>${esc(c.name)}</strong><div class="muted">${esc(c.class_name||'')} ${c.house_name?'• '+esc(c.house_name):''}<br>Sign: ${esc(c.symbol_name||'—')}</div></div><div><img class="symbol" src="${esc(c.symbol_url||ph('SIGN'))}"><br><button class="btn danger" data-del="${c.id}" style="margin-top:7px">Delete</button></div></div>`).join(''):'<div class="muted">No candidates yet.</div>');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteCandidate(b.dataset.del))}async function deleteCandidate(id){if(!confirm('Delete this candidate?'))return;const{error}=await db.from('candidates').delete().eq('id',id);if(error)msg(error.message,'error');else{msg('Candidate deleted.','success');await loadCandidates();await loadResults()}}async function loadResults(){if(!selected)return;const{data,error}=await db.rpc('get_results',{p_election_id:selected});if(error)throw error;$('results').classList.remove('hidden');const total=(data||[]).reduce((s,r)=>s+Number(r.vote_count),0);$('results').innerHTML=`<h2>📊 Vote Analysis</h2><div class="stats"><div class="stat"><span class="muted">Candidates</span><b>${data?.length||0}</b></div><div class="stat"><span class="muted">Total votes</span><b>${total}</b></div><div class="stat"><span class="muted">Highest count</span><b>${data?.[0]?.vote_count||0}</b></div></div>`+(data||[]).map((r,i)=>{let pct=total?Number(r.vote_count)/total*100:0;return`<div style="margin:15px 0"><div class="row"><strong>${i+1}. ${esc(r.candidate_name)}</strong><span>${r.vote_count} • ${pct.toFixed(1)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')}$('electionForm').onsubmit=async ev=>{ev.preventDefault();try{const payload={title:$('etitle').value.trim(),category:$('ecategory').value,gender:$('egender').value,description:$('edesc').value.trim(),start_time:$('estart').value?new Date($('estart').value).toISOString():null,end_time:$('eend').value?new Date($('eend').value).toISOString():null};const{error}=await db.from('elections').insert(payload);if(error)throw error;ev.target.reset();msg('Election created.','success');await loadElections()}catch(e){msg(e.message,'error')}};$('candidateForm').onsubmit=async ev=>{ev.preventDefault();if(!selected)return;try{const{error}=await db.from('candidates').insert({election_id:selected,name:$('cname').value.trim(),class_name:$('cclass').value.trim()||null,house_name:$('chouse').value.trim()||null,symbol_name:$('csymbol').value.trim()||null,photo_url:$('cphoto').value.trim()||null,symbol_url:$('csymbolurl').value.trim()||null});if(error)throw error;ev.target.reset();msg('Candidate added.','success');await loadCandidates();await loadResults()}catch(e){msg(e.message,'error')}};$('refresh').onclick=async()=>{try{await loadElections();if(selected)await selectElection(selected)}catch(e){msg(e.message,'error')}};$('loginForm').onsubmit=async ev=>{ev.preventDefault();try{const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await boot()}catch(e){$('loginMsg').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}};async function boot(){try{await admin();$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');await loadElections()}catch(e){$('loginMsg').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}$('logout').onclick=async()=>{await schoolVote.logout();location.reload()};(async()=>{try{if(await schoolVote.session())await boot()}catch(e){console.error(e)}})();</script></body></html>
