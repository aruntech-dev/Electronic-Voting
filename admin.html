<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voting Admin Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}header{background:#111827;color:#fff;padding:18px 22px;display:flex;justify-content:space-between}main{max-width:1100px;margin:25px auto;padding:0 15px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px #0001}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd2dc;border-radius:9px;margin:6px 0 12px}textarea{min-height:90px}button{padding:10px 14px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.muted{background:#e5e7eb}.hidden{display:none}.status{padding:12px;background:#eef2ff;border-radius:9px;margin-top:10px}.item{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.small{font-size:13px;color:#64748b}</style></head><body><header><b>Voting Admin Dashboard</b><a href="index.html" style="color:white">Voting page</a></header><main>
<section id="loginCard" class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="primary" id="login">Login</button><div id="loginMsg" class="status hidden"></div></section>
<section id="dash" class="hidden"><div class="card"><div class="row"><h2>Dashboard</h2><button class="muted" id="logout">Logout</button></div><div id="status" class="status"></div></div>
<div class="card"><h3>Create Election</h3><input id="title" placeholder="Election title"><textarea id="desc" placeholder="Description"></textarea><div class="row"><div>Start<input id="start" type="datetime-local"></div><div>End<input id="end" type="datetime-local"></div></div><button class="primary" id="create">Create election</button></div>
<div class="card"><h3>Elections</h3><div id="elections"></div></div>
<div class="card"><h3>Add Candidate</h3><select id="select"></select><input id="cname" placeholder="Candidate name"><input id="party" placeholder="Party / group"><input id="symbol" placeholder="Symbol"><button class="primary" id="add">Add candidate</button><div id="clist"></div></div>
<div class="card"><h3>Results</h3><button class="primary" id="resultsBtn">Load results</button><div id="results"></div></div></section></main>
<script>
let elections=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function msg(id,t){$(id).textContent=t;$(id).classList.remove('hidden')}
async function admin(){let s=await getSession();if(!s)throw Error('Not logged in.');let r=await db.from('profiles').select('role').eq('id',s.user.id).single();if(r.error)throw r.error;if(r.data.role!=='admin')throw Error('This account is not an admin.')}
async function load(){let r=await db.from('elections').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;elections=r.data||[];$('select').innerHTML=elections.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join('');$('elections').innerHTML=elections.map(e=>`<div class="item"><b>${esc(e.title)}</b> — ${e.is_active?'ACTIVE':'Closed'}<p class="small">${esc(e.description||'')}</p><button class="${e.is_active?'danger':'primary'}" onclick="toggle('${e.id}',${!e.is_active})">${e.is_active?'Close':'Open'}</button></div>`).join('');await candidates()}
window.toggle=async(id,on)=>{try{if(on){let x=await db.from('elections').update({is_active:false}).neq('id',id);if(x.error)throw x.error}let r=await db.from('elections').update({is_active:on}).eq('id',id);if(r.error)throw r.error;await load();msg('status',on?'Election opened.':'Election closed.')}catch(e){msg('status',e.message)}};
async function candidates(){let id=$('select').value;if(!id)return;let r=await db.from('candidates').select('*').eq('election_id',id).order('created_at');if(r.error)throw r.error;$('clist').innerHTML=(r.data||[]).map(c=>`<div class="item"><b>${esc(c.name)}</b> — ${esc(c.party||'')} ${esc(c.symbol||'')}</div>`).join('')}
$('login').onclick=async()=>{try{let r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;await admin();$('loginCard').classList.add('hidden');$('dash').classList.remove('hidden');await load();msg('status','Admin authenticated.')}catch(e){msg('loginMsg',e.message)}};
$('create').onclick=async()=>{try{let p={title:$('title').value.trim(),description:$('desc').value.trim(),start_time:$('start').value?new Date($('start').value).toISOString():null,end_time:$('end').value?new Date($('end').value).toISOString():null,is_active:false};if(!p.title)throw Error('Enter a title.');let r=await db.from('elections').insert(p);if(r.error)throw r.error;await load();msg('status','Election created.')}catch(e){msg('status',e.message)}};
$('select').onchange=candidates;$('add').onclick=async()=>{try{let p={election_id:$('select').value,name:$('cname').value.trim(),party:$('party').value.trim()||null,symbol:$('symbol').value.trim()||null};if(!p.election_id||!p.name)throw Error('Select an election and enter candidate name.');let r=await db.from('candidates').insert(p);if(r.error)throw r.error;$('cname').value=$('party').value=$('symbol').value='';await candidates();msg('status','Candidate added.')}catch(e){msg('status',e.message)}};
$('resultsBtn').onclick=async()=>{try{let r=await db.rpc('get_results',{p_election_id:$('select').value});if(r.error)throw r.error;$('results').innerHTML='<table><tr><th>Candidate</th><th>Votes</th></tr>'+(r.data||[]).map(x=>`<tr><td>${esc(x.candidate_name)}</td><td>${x.vote_count}</td></tr>`).join('')+'</table>'}catch(e){msg('status',e.message)}};$('logout').onclick=signOut;
(async()=>{try{if(await getSession()){await admin();$('loginCard').classList.add('hidden');$('dash').classList.remove('hidden');await load()}}catch(e){}})();
</script></body></html>
