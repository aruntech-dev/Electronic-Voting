<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electronic Voting System</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}header{background:#111827;color:white;padding:18px 22px;display:flex;justify-content:space-between}main{max-width:900px;margin:25px auto;padding:0 15px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px #0001}input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd2dc;border-radius:9px}button{padding:11px 16px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:white}.muted{background:#e5e7eb}.candidate{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #ddd;border-radius:12px;margin:10px 0}.candidate input{width:auto;margin:0}.symbol{width:48px;height:48px;border-radius:10px;background:#eef2ff;display:grid;place-items:center;font-weight:bold}.status{padding:12px;background:#eef2ff;border-radius:9px;margin-top:10px}.hidden{display:none}.small{color:#64748b;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}</style></head><body><header><b>Electronic Voting System</b><a href="admin.html" style="color:white">Admin</a></header><main>
<section id="auth" class="card"><h2>Voter Login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="row"><button class="primary" id="login">Login</button><button class="muted" id="register">Create account</button></div><div id="authMsg" class="status hidden"></div></section>
<section id="app" class="hidden"><div class="card"><div class="row"><div><h2 id="title">Loading...</h2><p id="desc" class="small"></p></div><button class="muted" id="logout">Logout</button></div><div id="status" class="status"></div></div>
<div class="card"><h3>Voter Profile</h3><input id="name" placeholder="Your name"><input id="code" placeholder="Voter code (if required)"><button class="primary" id="save">Save profile</button></div>
<div id="ballot" class="card hidden"><h2>Ballot</h2><p class="small">Choose one candidate. Your account can vote only once in this election.</p><div id="candidates"></div><button class="primary" id="vote">Submit Vote</button><div id="voteMsg" class="status hidden"></div></div></section></main>
<script>
let election=null,voter=null;
const $=id=>document.getElementById(id), msg=(id,t)=>{$(id).textContent=t;$(id).classList.remove('hidden')};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){let {data,error}=await db.from('elections').select('*').eq('is_active',true).order('created_at',{ascending:false}).limit(1);if(error)throw error;election=data?.[0];if(!election){$('title').textContent='No active election';msg('status','There is currently no active election.');return}$('title').textContent=election.title;$('desc').textContent=election.description||'';let n=Date.now(),s=election.start_time&&Date.parse(election.start_time),e=election.end_time&&Date.parse(election.end_time);if(s&&n<s||e&&n>e){msg('status','The election is outside its voting time.');return}msg('status','Election is open.');let r=await db.from('candidates').select('*').eq('election_id',election.id).order('created_at');if(r.error)throw r.error;$('candidates').innerHTML=r.data.map(c=>`<label class="candidate"><input type="radio" name="candidate" value="${c.id}"><div class="symbol">${esc(c.symbol||'✓')}</div><div><b>${esc(c.name)}</b><br><span class="small">${esc(c.party||'Independent')}</span></div></label>`).join('')}
async function profile(){let s=await getSession();if(!s)return;let r=await db.from('voters').select('*').eq('user_id',s.user.id).maybeSingle();if(r.error)throw r.error;voter=r.data;if(voter){$('name').value=voter.voter_name;$('code').value=voter.voter_code||'';$('ballot').classList.remove('hidden')}}
$('login').onclick=async()=>{try{let r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await profile();await load()}catch(e){msg('authMsg',e.message)}};
$('register').onclick=async()=>{try{let r=await db.auth.signUp({email:$('email').value,password:$('password').value});if(r.error)throw r.error;msg('authMsg',r.data.session?'Account created.':'Account created. Check your email if confirmation is enabled.')}catch(e){msg('authMsg',e.message)}};
$('save').onclick=async()=>{try{let s=await getSession();if(!s)throw Error('Please log in.');let p={user_id:s.user.id,voter_name:$('name').value.trim(),voter_code:$('code').value.trim()||null};if(!p.voter_name)throw Error('Enter your name.');let r=voter?await db.from('voters').update(p).eq('id',voter.id).select().single():await db.from('voters').insert(p).select().single();if(r.error)throw r.error;voter=r.data;$('ballot').classList.remove('hidden');msg('status','Voter profile saved.')}catch(e){msg('status',e.message)}};
$('vote').onclick=async()=>{try{if(!election||!voter)throw Error('Complete your profile first.');let c=document.querySelector('input[name=candidate]:checked');if(!c)throw Error('Select a candidate.');if(!confirm('Submit your vote? This cannot be undone.'))return;let r=await db.rpc('cast_vote',{p_election_id:election.id,p_candidate_id:c.value});if(r.error)throw r.error;msg('voteMsg',r.data);$('vote').disabled=true}catch(e){msg('voteMsg',e.message)}};$('logout').onclick=signOut;
(async()=>{try{let s=await getSession();if(s){$('auth').classList.add('hidden');$('app').classList.remove('hidden');await profile();await load()}}catch(e){console.error(e)}})();
</script></body></html>
