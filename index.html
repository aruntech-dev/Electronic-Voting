<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolVote • Student Election</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><style>
:root{--p:rgba(18,25,55,.8);--l:#ffffff1a;--t:#f7f8ff;--m:#aab4d8;--a:#7c5cff;--b:#20d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--t);font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 8% 10%,#342476,transparent 30%),radial-gradient(circle at 92% 18%,#075d73,transparent 28%),linear-gradient(135deg,#050716,#0d1230 55%,#050817);overflow-x:hidden}body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(8px);opacity:.24;animation:f 12s ease-in-out infinite alternate}body:before{width:280px;height:280px;background:#7c5cff;left:-110px;top:8%}body:after{width:230px;height:230px;background:#20d3ee;right:-90px;bottom:5%;animation-delay:-5s}@keyframes f{to{transform:translate(45px,-30px) scale(1.15)}}.wrap{width:min(1100px,93%);margin:auto;padding:24px 0 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900}.brand span{color:var(--b)}.panel{background:var(--p);border:1px solid var(--l);border-radius:24px;padding:24px;backdrop-filter:blur(16px);box-shadow:0 20px 60px #0005}.hero{text-align:center;margin:20px 0;padding:34px}.hero h1{font-size:clamp(31px,6vw,58px);margin:5px;background:linear-gradient(90deg,#fff,#9ceeff,#b9a8ff);-webkit-background-clip:text;color:transparent}.muted{color:var(--m)}.field{margin:10px 0}.field label{display:block;color:var(--m);font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--l);background:#060a1d;color:#fff;font-size:16px}.btn,.vote{padding:12px 15px;border-radius:12px;font-weight:800;cursor:pointer;color:#fff;border:1px solid var(--l);background:#ffffff0c}.vote{border:0;background:linear-gradient(90deg,var(--a),var(--b));width:100%}.hidden{display:none!important}.notice{padding:13px 15px;border-radius:13px;background:#ffffff09;color:var(--m);margin:12px 0}.error{background:#ff3d3d18;color:#ffb2b2}.success{background:#20d99218;color:#9ef4ce}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.candidate{padding:13px;border:1px solid var(--l);border-radius:20px;background:#070b20;overflow:hidden;transition:.25s}.candidate:hover{transform:translateY(-5px)}.photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:15px;background:#171d3d}.symbol{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:12px;border:4px solid #10152e;margin-top:-28px;position:relative}.name{font-size:20px;font-weight:900;margin-top:8px}.meta{font-size:13px;color:var(--m);min-height:40px}.modalbg{position:fixed;inset:0;z-index:10;background:#000b;display:grid;place-items:center;padding:20px}.modal{width:min(430px,100%);text-align:center}.actions{display:flex;gap:10px;justify-content:center}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #fff5;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.small{font-size:12px}@media(max-width:600px){.wrap{width:94%}.panel{padding:17px}.grid{grid-template-columns:1fr 1fr;gap:10px}.candidate{padding:9px}.name{font-size:16px}.meta{font-size:11px}.symbol{width:45px;height:45px}.vote{font-size:12px;padding:11px 5px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">🏫 School<span>Vote</span></div><button id="logout" class="btn hidden">Logout</button></header><section id="loginBox" class="panel hero"><div style="font-size:50px">🗳️</div><h1>Student Election</h1><p class="muted">House Captain • Head Boy / Head Girl</p><form id="loginForm"><div class="field"><label>Student email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button id="loginBtn" class="vote" type="submit">Login & Enter Election</button></form><div id="loginMsg"></div><p class="small muted">Your school administrator must create your voter profile.</p></section><section id="app" class="hidden"><section class="panel hero"><div style="font-size:46px">🎓</div><h1>Choose Your Candidate</h1><p id="studentLine" class="muted">Loading…</p></section><div id="status" class="notice">Loading elections…</div><div id="elections"></div></section></div><div id="confirm" class="modalbg hidden"><div class="panel modal"><div style="font-size:42px">✅</div><h2>Confirm Your Vote</h2><p id="confirmText"></p><p class="small muted">After submission, this vote cannot be changed.</p><div class="actions"><button id="cancel" class="btn">Cancel</button><button id="confirmBtn" class="vote" style="width:auto">Confirm Vote</button></div></div></div>
<script>const $=id=>document.getElementById(id);let session=null,voter=null,pending=null;function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function notice(t,type=''){let e=$('status');e.textContent=t;e.className='notice '+type}function loginNotice(t,type=''){let e=$('loginMsg');e.textContent=t;e.className='notice '+type}function ph(t){return'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="100%" height="100%" fill="#171d3d"/><text x="50%" y="50%" fill="#a4aed0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="34">${t}</text></svg>`)}function card(c,e){return`<article class="candidate"><img class="photo" src="${esc(c.photo_url||ph('PHOTO'))}" alt="${esc(c.name)} photo"><img class="symbol" src="${esc(c.symbol_url||ph('SIGN'))}" alt="Election sign"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.class_name||'')} ${c.house_name?'• '+esc(c.house_name):''}<br>${c.symbol_name?'Sign: '+esc(c.symbol_name):''}</div><button class="vote choose" data-election="${e.id}" data-candidate="${c.id}" data-name="${esc(c.name)}">Vote</button></article>`}async function loadVoter(){const{data,error}=await db.from('voters').select('id,voter_name,student_code').eq('user_id',session.user.id).maybeSingle();if(error)throw error;voter=data;$('studentLine').textContent=data?`Welcome, ${data.voter_name}${data.student_code?' • '+data.student_code:''}`:'Voter profile missing'}async function loadElections(){$('elections').innerHTML='';notice('Loading open elections…');const{data:els,error}=await db.from('elections').select('*').eq('is_active',true).order('created_at',{ascending:false});if(error)throw error;if(!els?.length){notice('No election is currently open.');return}notice('Select a candidate and confirm your vote.');for(const e of els){const{data:cands,error:ce}=await db.from('candidates').select('*').eq('election_id',e.id).order('display_order').order('name');if(ce)throw ce;let sec=document.createElement('section');sec.className='panel';sec.style.marginTop='18px';sec.innerHTML=`<h2>${esc(e.title)}</h2><p class="muted">${esc(e.description||'')}</p><div class="grid">${cands?.length?cands.map(c=>card(c,e)).join(''):'<div class="notice">No candidates added yet.</div>'}</div>`;$('elections').appendChild(sec)}document.querySelectorAll('.choose').forEach(b=>b.onclick=()=>{pending={election:b.dataset.election,candidate:b.dataset.candidate,name:b.dataset.name};$('confirmText').textContent=`You selected ${pending.name}. Are you sure?`;$('confirm').classList.remove('hidden')})}$('cancel').onclick=()=>{$('confirm').classList.add('hidden');pending=null};$('confirmBtn').onclick=async()=>{if(!pending||!voter)return;let b=$('confirmBtn');b.disabled=true;b.innerHTML='<span class="spinner"></span> Saving…';try{const{error}=await db.rpc('cast_vote',{p_election_id:pending.election,p_candidate_id:pending.candidate});if(error)throw error;$('confirm').classList.add('hidden');pending=null;notice('✓ Your vote has been recorded successfully.','success');await loadElections()}catch(e){$('confirm').classList.add('hidden');notice(e.message||'Vote could not be recorded.','error')}finally{b.disabled=false;b.textContent='Confirm Vote'}};$('loginForm').onsubmit=async ev=>{ev.preventDefault();let b=$('loginBtn');b.disabled=true;b.innerHTML='<span class="spinner"></span> Logging in…';try{const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;session=data.session;$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');await loadVoter();if(!voter){notice('Your voter profile has not been created by the administrator.','error');return}await loadElections()}catch(e){loginNotice(e.message||'Login failed.','error')}finally{b.disabled=false;b.textContent='Login & Enter Election'}};$('logout').onclick=async()=>{await schoolVote.logout();location.reload()};(async()=>{try{session=await schoolVote.session();if(session){$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');await loadVoter();if(voter)await loadElections()}}catch(e){console.error(e)}})();</script></body></html>
