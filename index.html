<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchoolVote • Student Voting</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<style>
:root{--bg:#060816;--panel:rgba(15,22,49,.78);--line:#ffffff1a;--text:#f8f9ff;--muted:#abb4d7;--a:#7c5cff;--b:#20d3ee;--ok:#42e6a0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at 12% 0,#34277a 0,transparent 30%),radial-gradient(circle at 90% 20%,#075b73 0,transparent 27%),linear-gradient(135deg,#050714,#0d1230,#050714);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(4px);opacity:.22;animation:float 12s ease-in-out infinite alternate}body:before{width:300px;height:300px;background:#7c5cff;left:-130px;top:12%}body:after{width:240px;height:240px;background:#20d3ee;right:-100px;bottom:4%;animation-delay:-4s}@keyframes float{to{transform:translate(45px,-30px) scale(1.15)}}
.wrap{width:min(1150px,94%);margin:auto;padding:20px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:25px;font-weight:900}.brand span{color:var(--b)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;backdrop-filter:blur(16px);box-shadow:0 20px 60px #0005}.hero{text-align:center;padding:34px 18px;margin:18px 0}.hero h1{font-size:clamp(32px,6vw,58px);margin:5px 0;background:linear-gradient(90deg,#fff,#9ceeff,#b7a6ff);-webkit-background-clip:text;color:transparent}.muted{color:var(--muted)}.field{margin:9px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#060a1d;color:#fff;font-size:16px;outline:none}.btn,.vote{border-radius:12px;padding:12px 15px;font-weight:850;cursor:pointer;border:1px solid var(--line);color:#fff;background:#ffffff0d}.vote{width:100%;border:0;background:linear-gradient(90deg,var(--a),var(--b))}.btn:disabled,.vote:disabled{opacity:.55;cursor:not-allowed}.notice{padding:13px 15px;border-radius:13px;background:#ffffff08;margin:12px 0;color:var(--muted)}.error{background:#ff434318;color:#ffb1b1}.success{background:#20db9317;color:#9bf5cd}.hidden{display:none!important}.studentbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.candidate{padding:12px;border-radius:20px;border:1px solid var(--line);background:#070b20;overflow:hidden;transition:.25s}.candidate:hover{transform:translateY(-5px);border-color:#ffffff38}.photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:15px;background:#171d3d}.symbol{width:58px;height:58px;object-fit:contain;border-radius:12px;background:#fff;border:4px solid #111632;margin-top:-28px;position:relative}.name{font-weight:900;font-size:19px;margin-top:8px}.meta{min-height:40px;font-size:13px;color:var(--muted)}.modalbg{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:20px}.modal{width:min(430px,100%);text-align:center}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.small{font-size:12px}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}a{color:#9fefff}
@media(max-width:600px){.wrap{width:94%;padding-top:14px}.panel{padding:17px;border-radius:18px}.studentbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:10px}.candidate{padding:9px}.name{font-size:15px}.meta{font-size:11px}.symbol{width:45px;height:45px}.vote{font-size:12px;padding:11px 5px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand">🏫 School<span>Vote</span></div><a href="admin.html">Admin</a></header>
<section class="panel hero"><div style="font-size:48px">🗳️</div><h1>School Election</h1><p class="muted">Vote easily — no student login required.</p></section>
<section class="panel">
  <h2>1. Enter Student Code</h2><p class="muted small">Use the code provided by your school.</p>
  <div class="studentbar"><div class="field"><label>Student code</label><input id="studentCode" placeholder="Example: STU-1025" autocomplete="off"></div><button id="loadBtn" class="btn">Load Elections</button></div>
  <div id="studentMsg"></div>
</section>
<section id="electionArea" class="hidden"></section>
</div>
<div id="modal" class="modalbg hidden"><div class="panel modal"><div style="font-size:42px">✅</div><h2>Confirm Vote</h2><p id="modalText"></p><p class="small muted">Your vote cannot be changed after confirmation.</p><div class="actions"><button id="cancel" class="btn">Cancel</button><button id="confirm" class="vote" style="width:auto">Confirm</button></div></div></div>
<script>
const $=id=>document.getElementById(id);let pending=null;
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function msg(t,type=''){const e=$('studentMsg');e.textContent=t;e.className='notice '+type}
function img(t){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="100%" height="100%" fill="#171d3d"/><text x="50%" y="50%" fill="#aab3d7" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="30">${t}</text></svg>`)}
function card(c,e){return `<article class="candidate"><img class="photo" src="${esc(c.photo_url||img('PHOTO'))}" alt="${esc(c.name)} photo"><img class="symbol" src="${esc(c.symbol_url||img('SIGN'))}" alt="${esc(c.symbol_name||'Election sign')}"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.class_name||'')} ${c.house_name?'• '+esc(c.house_name):''}<br>${c.symbol_name?'Sign: '+esc(c.symbol_name):''}</div><button class="vote pick" data-election="${e.id}" data-candidate="${c.id}" data-name="${esc(c.name)}">Vote for ${esc(c.name)}</button></article>`}
async function load(){const code=$('studentCode').value.trim();if(!code){msg('Enter your student code first.','error');return}const b=$('loadBtn');b.disabled=true;b.innerHTML='Checking…';try{const {data:els,error}=await db.from('elections').select('*').eq('is_active',true).order('created_at',{ascending:false});if(error)throw error;if(!els?.length){$('electionArea').classList.remove('hidden');$('electionArea').innerHTML='<section class="panel"><h2>No election is open</h2><p class="muted">Please wait for the school administrator to open voting.</p></section>';return}$('electionArea').classList.remove('hidden');$('electionArea').innerHTML='';for(const e of els){const {data:c,error:ce}=await db.from('candidates').select('*').eq('election_id',e.id).order('display_order').order('name');if(ce)throw ce;const s=document.createElement('section');s.className='panel';s.style.marginTop='18px';s.innerHTML=`<h2>${esc(e.title)}</h2><p class="muted">${esc(e.description||'Choose one candidate.')}</p><div class="grid">${c?.length?c.map(x=>card(x,e)).join(''):'<div class="notice">No candidates added.</div>'}</div>`;$('electionArea').appendChild(s)}document.querySelectorAll('.pick').forEach(x=>x.onclick=()=>{pending={election:x.dataset.election,candidate:x.dataset.candidate,name:x.dataset.name};$('modalText').textContent=`You selected ${pending.name}. Are you sure?`;$('modal').classList.remove('hidden')});msg('Select one candidate and confirm your vote.')}catch(e){msg(e.message||'Could not load elections.','error')}finally{b.disabled=false;b.textContent='Load Elections'}}
$('loadBtn').onclick=load;$('studentCode').addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('cancel').onclick=()=>{$('modal').classList.add('hidden');pending=null};$('confirm').onclick=async()=>{if(!pending)return;const b=$('confirm');b.disabled=true;b.textContent='Saving…';try{const {error}=await db.rpc('cast_vote_public',{p_student_code:$('studentCode').value.trim(),p_election_id:pending.election,p_candidate_id:pending.candidate});if(error)throw error;$('modal').classList.add('hidden');msg('✓ Vote saved successfully to the school voting database.','success');document.querySelectorAll('.pick').forEach(x=>x.disabled=true)}catch(e){$('modal').classList.add('hidden');msg(e.message||'Vote failed.','error')}finally{b.disabled=false;b.textContent='Confirm'}};
</script></body></html>
